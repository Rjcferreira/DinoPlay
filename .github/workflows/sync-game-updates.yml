name: Atualizar jogos aprovados
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-game-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Procurar versões estáveis de jogos já aprovados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-game-updates.mjs
      - run: node scripts/build-remote-catalog.mjs
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/audit-remote-games.mjs
      - run: node scripts/test-download-links.mjs
      - run: node scripts/test-platform-contracts.mjs
      - run: node scripts/test-i18n.mjs
      - run: node scripts/test-multiplayer-presence.mjs
      - run: node scripts/validate-play-release.mjs
      - name: Publicar catálogo apenas quando toda a revisão passar
        run: |
          if git diff --quiet -- games/registry.json games/catalog.json assets/game-covers; then exit 0; fi
          git config user.name "DinoPlay Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add games/registry.json games/catalog.json assets/game-covers
          git commit -m "Update approved games automatically"
          git push
