<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:"><meta name="theme-color" content="#14153a"><title>DinoMusic</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app">
  <header><button id="close" class="round" aria-label="Voltar">‹</button><div><small>DinoPlay</small><h1>DinoMusic</h1></div><button id="sound" class="round" aria-label="Som">🔊</button></header>
  <section class="hero"><div><small id="welcome">MÚSICA PARA PEQUENOS EXPLORADORES</small><h2 id="heroTitle">Escolhe, ouve e diverte-te!</h2><p id="heroText">Quatro aventuras musicais sem anúncios.</p></div><span>🎵🦕</span></section>
  <label class="search"><span>🔎</span><input id="search" type="search" placeholder="Procurar música" autocomplete="off" spellcheck="false"><button id="clear" class="hidden" aria-label="Limpar pesquisa">×</button></label>
  <nav id="filters" class="filters"></nav>
  <section class="library"><div class="section-title"><div><small id="collectionLabel">A TUA COLEÇÃO</small><h2 id="songsTitle">Todas as músicas</h2></div><span id="count">4</span></div><div id="tracks" class="tracks"></div><div id="empty" class="empty hidden">🦕🔍<b id="emptyTitle">Nenhuma música encontrada</b></div></section>
  <section id="nowPlaying" class="now-playing hidden"><img id="miniCover" alt=""><button id="miniOpen"><b id="miniTitle"></b><small id="miniCategory"></small></button><button id="miniPrev" aria-label="Anterior">⏮</button><button id="miniPlay" aria-label="Reproduzir">▶</button><button id="miniNext" aria-label="Seguinte">⏭</button><div id="miniProgress"></div></section>
  <section id="player" class="player hidden"><div id="playerBackdrop"></div><header><button id="playerClose" class="round">⌄</button><b id="nowLabel">A REPRODUZIR</b><button id="playerFavorite" class="round">♡</button></header><div class="disc-wrap"><div id="glow" class="glow"></div><img id="bigCover" alt=""><i id="visualizer"><span></span><span></span><span></span><span></span><span></span></i></div><div class="player-info"><small id="bigCategory"></small><h2 id="bigTitle"></h2><p id="bigDescription"></p></div><input id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="repeat" aria-label="Repetir">↻</button><button id="prev" aria-label="Anterior">⏮</button><button id="playPause" class="main-play" aria-label="Reproduzir">▶</button><button id="next" aria-label="Seguinte">⏭</button><button id="shuffle" aria-label="Aleatório">🔀</button></div></section>
</main><audio id="audio" preload="metadata"></audio><script src="../../../sdk/dinoplay-game-sdk.js"></script><script src="game.js"></script></body></html>
