<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:">
  <title>Dino Bubbles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen open hero">
      <div class="hero-shade"></div>
      <div class="hero-content">
        <p class="eyebrow">DINO BUBBLES</p>
        <h1 id="title">Aventura das Bolhas</h1>
        <p id="tagline">Aponta, combina cores e faz as bolhas explodir!</p>
        <button id="play" class="primary">JOGAR</button>
        <button id="levelsButton" class="secondary">ESCOLHER NÍVEL</button>
      </div>
    </section>
    <section id="levels" class="screen panel-screen">
      <div class="panel"><button id="closeLevels" class="close">×</button><p class="eyebrow">DINO BUBBLES</p><h2 id="levelsTitle">Escolhe um nível</h2><div id="levelGrid" class="level-grid"></div></div>
    </section>
    <section id="game" class="game-screen">
      <header class="hud">
        <button id="back" class="icon">‹</button>
        <div><small id="levelWord">NÍVEL</small><b id="levelNumber">1</b></div>
        <div><small id="scoreWord">PONTOS</small><b id="score">0</b></div>
        <div><small id="shotsWord">ATÉ DESCER</small><b id="misses">6</b></div>
        <button id="restart" class="icon">↻</button><button id="sound" class="icon">🔊</button>
      </header>
      <div class="canvas-wrap"><canvas id="board" width="840" height="1180" aria-label="Jogo das bolhas"></canvas></div>
      <div id="toast" class="toast"></div>
    </section>
    <section id="result" class="screen panel-screen">
      <div class="panel result"><div class="mascot">🦕✨</div><p id="resultEyebrow" class="eyebrow">NÍVEL CONCLUÍDO</p><h2 id="resultTitle">Fantástico!</h2><div id="stars" class="stars">★★★</div><p><span id="finalScoreLabel">Pontuação</span> <b id="finalScore">0</b></p><button id="next" class="primary">PRÓXIMO NÍVEL</button><button id="retry" class="secondary">JOGAR NOVAMENTE</button><button id="resultLevels" class="text-button">ESCOLHER NÍVEL</button></div>
    </section>
  </main>
  <script src="../../../sdk/dinoplay-game-sdk.js"></script><script src="game.js"></script>
</body>
</html>
